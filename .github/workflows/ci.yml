name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package
        run: pip install -e ".[api,dev,plots]" ruff
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm ci` fails on Linux: the lock file was written on Windows and lacks the optional
      # wasm32 packages (@emnapi/*). `npm install` keeps the locked versions and fills the gap.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  # Accessibility (axe) on the guide, the home and /transparencia. Playwright and axe are installed at fixed
  # versions, not saved in package.json. The failure messages tell the cause apart:
  #   "INFRA:"  the browser, the server or the network failed (re-run; not a finding about the pages)
  #   "A11Y:"   real accessibility violations (fix the pages)
  a11y:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_VERSION: "1.55.0"
      AXE_PLAYWRIGHT_VERSION: "4.10.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright and axe (fixed versions, not saved)
        run: npm install --no-save --no-audit --no-fund "@playwright/test@${PLAYWRIGHT_VERSION}" "@axe-core/playwright@${AXE_PLAYWRIGHT_VERSION}"
      - name: Cache the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}
      - name: "INFRA: install Chromium"
        run: npx playwright install --with-deps chromium || { echo "::error title=INFRA::Chromium could not be installed. This is not an accessibility finding; re-run the job."; exit 1; }
      - name: "INFRA: start the web server"
        run: |
          nohup npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/guia > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error title=INFRA::The web server did not answer in 60 s. This is not an accessibility finding."
          cat server.log
          exit 1
      - name: "A11Y: axe on the guide, the home and /transparencia"
        run: |
          set +e
          BASE_URL=http://localhost:3000 node scripts/a11y.mjs
          code=$?
          if [ "$code" -eq 2 ]; then echo "::error title=INFRA::The check could not run (see the INFRA lines above). Not an accessibility finding."; fi
          if [ "$code" -eq 1 ]; then echo "::error title=A11Y::Accessibility violations found (see the A11Y lines above)."; fi
          exit $code
