[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "para-triage"
version = "0.1.0"
description = "Multimodal triage of Para athletics eligibility and event recommendation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "torch",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]"]
dev = ["pytest", "httpx"]
plots = ["matplotlib"]  # figures of the paper experiments (experiments.paper_outputs)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
para_triage = ["rules/*.yaml"]
"para_triage.rulebook" = ["data/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
